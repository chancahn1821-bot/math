<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">

<!-- Firebase SDK 불러오기 (CDN Compat Script) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root {
  --primary: #e07a5f;
  --primary-hover: #d16649;
  --bg: #fefae0;
  --card-bg: #ffffff;
  --border: #f4a26133;
  --text: #3d405b;
  --accent: #f4a261;
  --danger: #e63946;
  --success: #2a9d8f;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Gowun Dodum', sans-serif; 
  background: var(--bg); 
  color: var(--text); 
  line-height: 1.6; 
}

h1, h2, h3, h4 { font-family: 'Gowun Batang', serif; }

.app-header { 
  background: #fff; 
  border-bottom: 3px solid var(--accent); 
  padding: 14px 28px; 
  display: flex; 
  justify-content: space-between; 
  align-items: center;
  box-shadow: 0 4px 15px rgba(224, 122, 95, 0.08);
}
.logo { font-size: 1.3rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
.logo-icon { background: var(--accent); color: #fff; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 1.1rem; }

.nav-btns { display: flex; gap: 10px; }
.nav-btn { 
  border: 2px solid var(--accent); 
  background: #fff; 
  color: var(--text);
  padding: 8px 18px; 
  border-radius: 20px; 
  font-family: 'Gowun Batang', serif;
  font-weight: 700; 
  cursor: pointer; 
  transition: all 0.2s;
}
.nav-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
.card { 
  background: var(--card-bg); 
  border: 2px solid #f2cc8f; 
  border-radius: 20px; 
  padding: 24px; 
  box-shadow: 0 8px 20px rgba(0,0,0,0.03); 
  margin-bottom: 20px; 
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

label { display: block; font-weight: 700; margin-top: 14px; margin-bottom: 6px; font-size: 0.95rem; color: var(--primary); }
input[type="text"], input[type="password"], select, textarea {
  width: 100%; padding: 12px 14px; border: 2px solid #f2cc8f; border-radius: 14px; font: inherit; outline: none; background: #fff;
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.15); }
textarea { min-height: 100px; resize: vertical; }

.btn { 
  border: 0; background: var(--primary); color: #fff; padding: 10px 22px; 
  border-radius: 14px; font-family: 'Gowun Batang', serif; font-weight: 700; cursor: pointer; transition: all 0.2s; 
}
.btn:hover { background: var(--primary-hover); }
.btn-secondary { background: #fff; color: var(--text); border: 2px solid #f2cc8f; }
.btn-danger { background: var(--danger); color: #fff; }

.status-bar {
  background: #f4a2611a; border: 2px dashed var(--accent); border-radius: 16px; padding: 12px 18px; margin-bottom: 16px;
  display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-around; align-items: center; font-size: 0.9rem;
}
.status-item span { font-weight: bold; color: var(--primary); }

/* 캔버스 및 드로잉 도구 스타일 */
.canvas-wrapper { border: 2px solid #f2cc8f; border-radius: 14px; overflow: hidden; background: #ffffff; margin-top: 8px; }
canvas { display: block; width: 100%; aspect-ratio: 2/1; cursor: crosshair; touch-action: none; background: #ffffff; }
.draw-tools { display: flex; gap: 8px; margin-bottom: 8px; }
.tool-btn { padding: 6px 14px; border: 2px solid #f2cc8f; background: #fff; border-radius: 10px; font-size: 0.85rem; cursor: pointer; }
.tool-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.math-keys { display: flex; flex-wrap: wrap; gap: 6px; background: #fdf0d5; padding: 10px; border-radius: 14px; margin-top: 8px; }
.key-btn { border: 1px solid #f4a261; background: #fff; padding: 5px 10px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; }

.preview-img { max-width: 100%; border-radius: 12px; border: 2px solid #f2cc8f; margin-top: 8px; }
.preview-pdf { width: 100%; height: 380px; border: 2px solid #f2cc8f; border-radius: 12px; margin-top: 8px; }
.tabs { display: flex; gap: 8px; border-bottom: 2px solid #f2cc8f; padding-bottom: 8px; margin-bottom: 16px; overflow-x: auto; }
.tab { padding: 6px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; color: var(--text); background: #fff; border: 1px solid #f2cc8f; white-space: nowrap; }
.tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.presentation-modal {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center;
  z-index: 9999; padding: 20px;
}
.presentation-content {
  background: #fff; width: 95%; max-width: 1100px; height: 90vh; border-radius: 20px;
  padding: 30px; overflow-y: auto; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.close-pres-btn {
  position: absolute; top: 20px; right: 25px; background: var(--danger); color: #fff;
  border: none; font-size: 1.2rem; font-weight: bold; width: 40px; height: 40px;
  border-radius: 50%; cursor: pointer; display: grid; place-items: center;
}

.print-only { display: none; }
@media print {
  .app-header, .nav-btns, .tabs, .btn, .draw-tools, .math-keys, select, input, textarea, .grid-2, .status-bar, .presentation-modal { display: none !important; }
  .card { border: none !important; box-shadow: none !important; padding: 0 !important; }
  body { background: #fff !important; }
  .print-only { display: block !important; }
  .page-break { page-break-after: always; margin-bottom: 20px; }
}
</style>
</head>
<body>

<header class="app-header">
  <div class="logo">
    <div class="logo-icon">✏️</div>
    <span>찬경T의 따뜻한 수학 교실</span>
  </div>
  <nav class="nav-btns">
    <button class="nav-btn active" id="btnStudentMode" onclick="switchMode('student')">학생용 🐥</button>
    <button class="nav-btn" id="btnTeacherMode" onclick="switchMode('teacher')">교사용 🧑‍🏫</button>
  </nav>
</header>

<main class="container" id="mainApp"></main>
<div id="presentationModalArea"></div>
<div id="printArea" class="print-only"></div>

<script>
// 전달받은 구글 Firebase 설정 적용
const firebaseConfig = {
  apiKey: "AIzaSyB6Yq5t7XP-0DP-wRTZWxhmnlTociM8Mqc",
  authDomain: "math-class-7f875.firebaseapp.com",
  databaseURL: "https://math-class-7f875-default-rtdb.firebaseio.com",
  projectId: "math-class-7f875",
  storageBucket: "math-class-7f875.firebasestorage.app",
  messagingSenderId: "17546076145",
  appId: "1:17546076145:web:9ec4ccfde2c614582e2e50"
};

// Firebase SDK 초기화
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

const symbols = ["√", "π", "θ", "±", "∞", "≤", "≥", "≠", "×", "÷", "²", "³", "°", "(", ")", "/", "^"];

let appState = { sheets: {}, works: {} };
let session = {
  mode: "student",
  isTeacherAuthed: false,
  selectedSheetId: "",
  selectedWorkId: "",
  currentProblemIdx: 0,
  activeTool: "pen",
  studentName: "",
  studentNum: "",
  teacherTargetWorkId: "",
  timerInterval: null,
  isDeparted: false,
  departureStartTime: null
};

// 실시간 데이터베이스 수신
function listenFirebase() {
  db.ref("sheets").on("value", (snapshot) => {
    appState.sheets = snapshot.val() || {};
    render();
  });

  db.ref("works").on("value", (snapshot) => {
    appState.works = snapshot.val() || {};
    render();
  });
}

function saveSheetsToFB() { db.ref("sheets").set(appState.sheets); }
function saveWorkToFB(work) { if (work && work.id) db.ref("works/" + work.id).set(work); }

// 이미지 압축 및 캔버스 흰색 바탕 보장 처리
function compressImage(file, maxWidth = 900, quality = 0.65) {
  return new Promise((resolve) => {
    if (!file.type.includes("image")) {
      const reader = new FileReader();
      reader.onload = () => resolve({ name: file.name, type: file.type, data: reader.result });
      reader.readAsDataURL(file);
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        
        // 캔버스 배경에 명시적으로 흰색을 채워 까맣게 저장되는 현상을 완전히 방지함
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);

        const compressedData = canvas.toDataURL("image/jpeg", quality);
        resolve({ name: file.name, type: "image/jpeg", data: compressedData });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

const $ = (sel) => document.querySelector(sel);
const getSheetList = () => Object.values(appState.sheets || {});
const getWorkList = () => Object.values(appState.works || {});
const getSheet = () => appState.sheets[session.selectedSheetId];
const getWork = () => appState.works[session.selectedWorkId];

function formatTime(ms) {
  const sec = Math.floor((ms || 0) / 1000);
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function switchMode(mode) {
  session.mode = mode;
  $("#btnStudentMode").classList.toggle("active", mode === "student");
  $("#btnTeacherMode").classList.toggle("active", mode === "teacher");
  render();
}

function render() {
  const container = $("#mainApp");
  if (!container) return;

  if (session.mode === "teacher") {
    container.innerHTML = session.isTeacherAuthed ? renderTeacherDashboard() : renderTeacherAuth();
  } else {
    container.innerHTML = (session.selectedWorkId && getWork()) ? renderStudentWorkspace() : renderStudentEntry();
  }
  initCanvas();
}

// 1. 학생 첫 메인 화면
function renderStudentEntry() {
  const publishedSheets = getSheetList().filter(s => s.published);
  return `
    <div class="card" style="max-width: 480px; margin: 40px auto; text-align: center;">
      <h2 style="color: var(--primary); margin-bottom: 6px;">반가워요! 수학 교실 입장 🎒</h2>
      <p style="color: #666; margin-bottom: 20px;">학습지를 선택하고 학번과 이름을 입력하세요.</p>
      
      <label style="text-align:left;">학습지 선택</label>
      <select id="entrySheetSelect">
        ${publishedSheets.length > 0 
          ? `<option value="">학습지를 선택하세요</option>` + publishedSheets.map(s => `<option value="${s.id}" ${session.selectedSheetId === s.id ? 'selected' : ''}>${s.title}</option>`).join('')
          : `<option value="">(현재 배포된 학습지가 없습니다. 교사용에서 생성해주세요)</option>`
        }
      </select>

      <label style="text-align:left;">학번</label>
      <input type="text" id="entryNum" placeholder="예: 20815" value="${session.studentNum}">

      <label style="text-align:left;">이름</label>
      <input type="text" id="entryName" placeholder="예: 홍길동" value="${session.studentName}">

      <button class="btn" onclick="startStudentWork()" style="width: 100%; margin-top: 24px; font-size: 1.1rem;">풀이 시작하기 ✨</button>
    </div>
  `;
}

// 2. 학생 풀이 및 손글씨 입력 화면
function renderStudentWorkspace() {
  const sheet = getSheet();
  const work = getWork();
  if (!sheet || !work) return renderStudentEntry();

  const probIdx = session.currentProblemIdx;
  const problems = sheet.problems || [];
  const prob = problems[probIdx] || { answer: "", solutionText: "", file: null, solutionFile: null };
  const responses = work.responses || [];
  const resp = responses[probIdx] || { answer: "", solution: "", drawing: "", attachedFile: null };

  let isCorrect = false;
  if (work.submitted && prob.answer) {
    const teacherAnswers = prob.answer.split("|").map(a => a.trim().toLowerCase());
    const studentAnswer = (resp.answer || "").trim().toLowerCase();
    isCorrect = teacherAnswers.includes(studentAnswer);
  }

  return `
    <div class="status-bar">
      <div class="status-item">⏰ 학습 시작: <span>${work.startTime || '-'}</span></div>
      <div class="status-item">⏳ 학습 시간: <span id="timeDisplay">${formatTime(work.activeMs)}</span></div>
      <div class="status-item">🚨 이탈 횟수: <span id="departuresDisplay">${work.departures || 0}회</span></div>
      <div class="status-item">🚶 누적 이탈 시간: <span id="departureMsDisplay">${formatTime(work.departureMs)}</span></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3>${sheet.title}</h3>
        <div class="tabs" style="margin-top: 12px;">
          ${problems.map((_, i) => `<div class="tab ${i === probIdx ? 'active' : ''}" onclick="switchProblemAutoSave(${i})">문제 ${i + 1}</div>`).join('')}
        </div>

        <div style="margin-top: 12px;">
          ${prob.file ? (
            prob.file.type.includes('pdf') 
              ? `<iframe class="preview-pdf" src="${prob.file.data}"></iframe>`
              : `<img class="preview-img" src="${prob.file.data}">`
          ) : '<p style="color: #888;">첨부된 문제가 없습니다.</p>'}
        </div>

        ${work.submitted ? `
          <div style="margin-top: 20px; padding: 14px; border: 2px solid #f2cc8f; border-radius: 12px; background: #fffbe6;">
            <h4 style="color: var(--primary);">💡 선생님 해설</h4>
            <p style="white-space: pre-line; margin-top: 6px;">${prob.solutionText || '등록된 텍스트 해설이 없습니다.'}</p>
            ${prob.solutionFile ? (
              prob.solutionFile.type.includes('pdf')
                ? `<iframe class="preview-pdf" src="${prob.solutionFile.data}" style="height: 250px;"></iframe>`
                : `<img class="preview-img" src="${prob.solutionFile.data}">`
            ) : ''}
          </div>
        ` : ''}
      </div>

      <div class="card">
        <h3>문제 ${probIdx + 1} 풀이 작성</h3>
        
        ${work.submitted ? `
          <div style="padding:12px; border-radius:14px; font-weight:bold; margin-bottom:16px; text-align:center; background:${isCorrect ? '#e8f5e9' : '#ffebee'}; color:${isCorrect ? '#2e7d32' : '#c62828'};">
            ${isCorrect ? '⭕ 정답입니다!' : '❌ 오답입니다.'}
          </div>
        ` : ''}

        <label>나의 풀이 과정 (텍스트)</label>
        <textarea id="inputSolution" oninput="autoSaveCurrent()" ${work.submitted ? 'disabled' : ''}>${resp.solution || ''}</textarea>

        <label>풀이 사진/PDF 파일 첨부 📎</label>
        ${!work.submitted ? `
          <input type="file" accept="image/*,application/pdf" onchange="uploadStudentFile(event)">
        ` : ''}
        ${resp.attachedFile ? (
          resp.attachedFile.type.includes('pdf')
            ? `<iframe class="preview-pdf" src="${resp.attachedFile.data}" style="height:250px;"></iframe>`
            : `<img class="preview-img" src="${resp.attachedFile.data}">`
        ) : ''}

        <label>손글씨 풀이 ✏️</label>
        ${!work.submitted ? `
          <div class="draw-tools">
            <button class="tool-btn ${session.activeTool === 'pen' ? 'active' : ''}" onclick="setTool('pen')">펜</button>
            <button class="tool-btn ${session.activeTool === 'eraser' ? 'active' : ''}" onclick="setTool('eraser')">지우개</button>
            <button class="tool-btn" onclick="clearCanvas()">전체 지우기</button>
          </div>
        ` : ''}
        <div class="canvas-wrapper">
          <canvas id="studentCanvas"></canvas>
        </div>

        <label>나의 정답</label>
        <input type="text" id="inputAnswer" oninput="autoSaveCurrent()" value="${resp.answer || ''}" ${work.submitted ? 'disabled' : ''}>
        
        ${!work.submitted ? `
          <div class="math-keys">
            ${symbols.map(s => `<button class="key-btn" onclick="insertSymbol('${s}', 'inputAnswer')">${s}</button>`).join('')}
          </div>
        ` : ''}

        <div style="display: flex; gap: 8px; margin-top: 20px;">
          ${!work.submitted ? `
            <button class="btn" onclick="submitStudentWork()" style="flex: 1;">최종 제출 🚀</button>
          ` : ''}
          <button class="btn btn-secondary" onclick="exitStudentWorkspace()">나가기</button>
        </div>
      </div>
    </div>
  `;
}

// 3. 교사 비밀번호 인증 화면
function renderTeacherAuth() {
  return `
    <div class="card" style="max-width: 400px; margin: 40px auto; text-align: center;">
      <h2 style="color: var(--primary); margin-bottom: 20px;">선생님 로그인 🔑</h2>
      <input type="password" id="teacherPw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') loginTeacher()">
      <button class="btn" onclick="loginTeacher()" style="width: 100%; margin-top: 16px;">인증하기</button>
    </div>
  `;
}

// 4. 교사 대시보드 (50명 학생 제출 모니터링)
function renderTeacherDashboard() {
  const sheets = getSheetList();
  const currentSheet = getSheet();
  const probIdx = session.currentProblemIdx;
  const currentProb = currentSheet?.problems ? currentSheet.problems[probIdx] : null;

  const studentWorks = getWorkList().filter(w => w.sheetId === session.selectedSheetId);
  const targetWork = studentWorks.find(w => w.id === session.teacherTargetWorkId);

  return `
    <div class="grid-2">
      <div class="card">
        <h3>학습지 관리 📚</h3>
        <div style="display: flex; gap: 8px; margin-top: 12px; margin-bottom: 20px;">
          <input type="text" id="newSheetTitle" placeholder="새 학습지 제목">
          <button class="btn" onclick="createSheet()" style="white-space: nowrap;">만들기</button>
        </div>

        <h4>등록된 학습지 목록</h4>
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
          ${sheets.length ? sheets.map(s => `
            <div style="padding: 12px; border: 2px solid #f2cc8f; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; background: ${s.id === session.selectedSheetId ? '#fefae0' : '#fff'}">
              <div>
                <strong>${s.title}</strong>
                <div style="font-size: 0.85rem; color: #666;">${s.published ? '🟢 배포 중' : '🔴 미배포'} · 문제 ${(s.problems || []).length}개</div>
              </div>
              <button class="btn btn-secondary" onclick="selectSheet('${s.id}')">선택</button>
            </div>
          `).join('') : '<p style="color: #888;">학습지를 등록해 주세요.</p>'}
        </div>
      </div>

      <div class="card">
        ${currentSheet ? `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h3>${currentSheet.title} 설정</h3>
            <button class="btn ${currentSheet.published ? 'btn-secondary' : ''}" onclick="togglePublish()">
              ${currentSheet.published ? '배포 중단' : '학생에게 배포'}
            </button>
          </div>

          <div class="tabs">
            ${(currentSheet.problems || []).map((_, i) => `<div class="tab ${i === probIdx ? 'active' : ''}" onclick="switchProblem(${i})">문제 ${i + 1}</div>`).join('')}
            ${(currentSheet.problems || []).length < 5 ? '<button class="btn btn-secondary" onclick="addProblem()" style="padding: 4px 10px;">+</button>' : ''}
          </div>

          <label>문제 파일 (PDF/이미지)</label>
          <input type="file" id="probFileInput" accept="image/*,application/pdf" onchange="uploadProbFile(event)">
          ${currentProb?.file ? (
            currentProb.file.type.includes('pdf')
              ? `<iframe class="preview-pdf" src="${currentProb.file.data}"></iframe>`
              : `<img class="preview-img" src="${currentProb.file.data}">`
          ) : ''}

          <label>정답 입력 (여러 정답은 | 구분자 사용)</label>
          <input type="text" id="teacherAnswer" value="${currentProb?.answer || ''}" oninput="updateTeacherAnswer(this.value)" placeholder="예: 3 | 3/1">
          <div class="math-keys">
            ${symbols.map(s => `<button class="key-btn" onclick="insertSymbol('${s}', 'teacherAnswer')">${s}</button>`).join('')}
          </div>

          <label>선생님 풀이 해설 (텍스트)</label>
          <textarea id="teacherSolutionText" oninput="updateTeacherSolution(this.value)" placeholder="풀이 과정을 입력하세요.">${currentProb?.solutionText || ''}</textarea>

          <label>선생님 풀이 해설 파일 (PDF/이미지 첨부)</label>
          <input type="file" id="solutionFileInput" accept="image/*,application/pdf" onchange="uploadSolutionFile(event)">
          ${currentProb?.solutionFile ? (
            currentProb.solutionFile.type.includes('pdf')
              ? `<iframe class="preview-pdf" src="${currentProb.solutionFile.data}" style="height: 250px;"></iframe>`
              : `<img class="preview-img" src="${currentProb.solutionFile.data}">`
          ) : ''}

          <div style="margin-top: 24px;">
            <button class="btn btn-danger" onclick="deleteCurrentSheet()">이 학습지 삭제</button>
          </div>
        ` : '<p style="color: #888;">좌측에서 학습지를 선택해 주세요.</p>'}
      </div>
    </div>

    ${currentSheet ? `
      <div class="card" style="margin-top: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <h3>👨‍🎓 실시간 학생 제출 현황 (${studentWorks.length}명)</h3>
          ${studentWorks.length > 0 ? `
            <button class="btn" onclick="printAllWorks()">전체 제출 내역 PDF 저장 🖨️</button>
          ` : ''}
        </div>
        
        <div style="display: flex; gap: 12px; margin-top: 14px; margin-bottom: 20px; flex-wrap: wrap;">
          <select id="teacherStudentSelect" style="flex: 1; min-width: 200px;" onchange="selectStudentWork(this.value)">
            <option value="">학생을 선택하세요</option>
            ${studentWorks.map(w => `<option value="${w.id}" ${w.id === session.teacherTargetWorkId ? 'selected' : ''}>[${w.number}] ${w.name} (${w.submitted ? '제출완료' : '풀이중'})</option>`).join('')}
          </select>
          ${targetWork ? `
            <button class="btn" onclick="openPresentationModal()">발표화면 보기 📺</button>
            <button class="btn btn-secondary" onclick="printSingleWork()">선택 학생 PDF 저장 🖨️</button>
          ` : ''}
        </div>

        ${targetWork ? renderSingleWorkHTML(targetWork, currentSheet) : ''}
      </div>
    ` : ''}
  `;
}

function renderSingleWorkHTML(work, sheet) {
  const problems = sheet.problems || [];
  return `
    <div style="padding: 16px; border: 2px solid #f2cc8f; border-radius: 14px; background: #fff;">
      <h4>학번: ${work.number} | 이름: ${work.name} (${work.submitted ? '✅ 제출완료' : '⏳ 진행중'})</h4>
      <div style="display:flex; gap:16px; margin:12px 0; background:#fefae0; padding:10px; border-radius:10px; font-size:0.9rem; flex-wrap: wrap;">
        <div>학습 시작: <strong>${work.startTime || '-'}</strong></div>
        <div>학습 시간: <strong>${formatTime(work.activeMs)}</strong></div>
        <div>이탈 횟수: <strong>${work.departures || 0}회</strong></div>
        <div>누적 이탈 시간: <strong>${formatTime(work.departureMs)}</strong></div>
      </div>

      ${problems.map((p, idx) => {
        const resp = (work.responses || [])[idx] || {};
        return `
          <div style="margin-bottom: 16px; padding: 12px; border: 1px solid #eee; border-radius: 8px;">
            <strong style="color: var(--primary);">[문제 ${idx + 1}]</strong><br>
            <strong>제출 답안:</strong> ${resp.answer || '(없음)'}<br>
            <strong>풀이 과정 (텍스트):</strong> ${resp.solution || '(없음)'}<br>
            ${resp.attachedFile ? `
              <div style="margin-top:6px;">
                <strong>첨부된 풀이 파일:</strong><br>
                ${resp.attachedFile.type.includes('pdf') 
                  ? `<iframe class="preview-pdf" src="${resp.attachedFile.data}" style="height:250px;"></iframe>` 
                  : `<img src="${resp.attachedFile.data}" style="max-width:100%; border:1px solid #ccc; margin-top:4px; border-radius:8px;">`}
              </div>
            ` : ''}
            ${resp.drawing ? `<div style="margin-top:6px;"><strong>손글씨 풀이:</strong><br><img src="${resp.drawing}" style="max-width:100%; border:1px solid #ccc; margin-top:4px; border-radius:8px; background:#fff;"></div>` : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function openPresentationModal() {
  const sheet = getSheet();
  const studentWorks = getWorkList().filter(w => w.sheetId === session.selectedSheetId);
  const targetWork = studentWorks.find(w => w.id === session.teacherTargetWorkId);
  if (!targetWork || !sheet) return alert("선택된 학생이 없습니다.");

  const modalArea = $("#presentationModalArea");
  modalArea.innerHTML = `
    <div class="presentation-modal">
      <div class="presentation-content">
        <button class="close-pres-btn" onclick="closePresentationModal()">✕</button>
        <h2 style="color: var(--primary); text-align: center; margin-bottom: 20px;">
          📢 [${sheet.title}] 우수 풀이 발표 (${targetWork.number} ${targetWork.name})
        </h2>
        ${renderSingleWorkHTML(targetWork, sheet)}
      </div>
    </div>
  `;
}

function closePresentationModal() {
  const modalArea = $("#presentationModalArea");
  if (modalArea) modalArea.innerHTML = "";
}

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closePresentationModal();
});

function printSingleWork() {
  const sheet = getSheet();
  const studentWorks = getWorkList().filter(w => w.sheetId === session.selectedSheetId);
  const targetWork = studentWorks.find(w => w.id === session.teacherTargetWorkId);
  if (!targetWork || !sheet) return alert("선택된 학생이 없습니다.");

  const printArea = $("#printArea");
  printArea.innerHTML = `
    <h2>${sheet.title} - 학생 제출 풀이</h2>
    ${renderSingleWorkHTML(targetWork, sheet)}
  `;
  window.print();
}

function printAllWorks() {
  const sheet = getSheet();
  const studentWorks = getWorkList().filter(w => w.sheetId === session.selectedSheetId);
  if (!studentWorks.length || !sheet) return alert("제출 내역이 있는 학생이 없습니다.");

  const printArea = $("#printArea");
  printArea.innerHTML = `
    <h2 style="text-align:center; margin-bottom: 20px;">[${sheet.title}] 전체 학생 제출 내역 (${studentWorks.length}명)</h2>
    ${studentWorks.map(work => `
      <div class="page-break">
        ${renderSingleWorkHTML(work, sheet)}
      </div>
    `).join('')}
  `;
  window.print();
}

// 화면 이탈 감지
function handleVisibilityChange() {
  const work = getWork();
  if (!work || work.submitted || session.mode !== "student") return;

  if (document.hidden || !document.hasFocus()) {
    if (!session.isDeparted) {
      session.isDeparted = true;
      session.departureStartTime = Date.now();
      work.departures = (work.departures || 0) + 1;
      saveWorkToFB(work);
      const depEl = $("#departuresDisplay");
      if (depEl) depEl.textContent = `${work.departures}회`;
    }
  } else {
    if (session.isDeparted) {
      session.isDeparted = false;
      if (session.departureStartTime) {
        const diff = Date.now() - session.departureStartTime;
        work.departureMs = (work.departureMs || 0) + diff;
        session.departureStartTime = null;
        saveWorkToFB(work);
        const depMsEl = $("#departureMsDisplay");
        if (depMsEl) depMsEl.textContent = formatTime(work.departureMs);
      }
    }
  }
}

document.addEventListener("visibilitychange", handleVisibilityChange);
window.addEventListener("blur", handleVisibilityChange);
window.addEventListener("focus", handleVisibilityChange);

function loginTeacher() {
  if ($("#teacherPw")?.value === "mathchan") {
    session.isTeacherAuthed = true;
    render();
  } else {
    alert("비밀번호가 올바르지 않습니다.");
  }
}

function startStudentWork() {
  const sheetId = $("#entrySheetSelect")?.value;
  const num = $("#entryNum")?.value.trim();
  const name = $("#entryName")?.value.trim();

  if (!sheetId) return alert("학습지를 선택하세요.");
  if (!num || !name) return alert("학번과 이름을 모두 입력하세요.");

  session.selectedSheetId = sheetId;
  session.studentNum = num;
  session.studentName = name;

  const workList = getWorkList();
  let work = workList.find(w => w.sheetId === sheetId && w.number === num && w.name === name);
  if (!work) {
    const sheet = getSheet();
    const now = new Date();
    work = {
      id: "w_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
      sheetId, number: num, name,
      startTime: `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`,
      activeMs: 0, departures: 0, departureMs: 0, submitted: false,
      responses: sheet ? (sheet.problems || []).map(() => ({ answer: "", solution: "", drawing: "", attachedFile: null })) : []
    };
    appState.works[work.id] = work;
    saveWorkToFB(work);
  }

  session.selectedWorkId = work.id;
  startTimer();
  render();
}

function submitStudentWork() {
  autoSaveCurrent();
  if (confirm("정말 제출하시겠습니까?")) {
    const work = getWork();
    if (work) {
      work.submitted = true;
      stopTimer();
      saveWorkToFB(work);
      render();
    }
  }
}

function exitStudentWorkspace() {
  autoSaveCurrent();
  stopTimer();
  session.selectedWorkId = "";
  render();
}

function createSheet() {
  const title = $("#newSheetTitle")?.value.trim();
  if (!title) return alert("제목을 입력하세요.");
  const sheetId = "s_" + Date.now();
  const newSheet = { id: sheetId, title, published: false, problems: [{ file: null, answer: "", solutionText: "", solutionFile: null }] };
  appState.sheets[sheetId] = newSheet;
  session.selectedSheetId = sheetId;
  saveSheetsToFB();
  render();
}

function selectSheet(id) {
  session.selectedSheetId = id;
  session.currentProblemIdx = 0;
  session.teacherTargetWorkId = "";
  render();
}

function selectStudentWork(id) {
  session.teacherTargetWorkId = id;
  render();
}

function togglePublish() {
  const sheet = getSheet();
  if (sheet) { sheet.published = !sheet.published; saveSheetsToFB(); render(); }
}

function switchProblem(idx) {
  session.currentProblemIdx = idx;
  render();
}

function switchProblemAutoSave(idx) {
  autoSaveCurrent();
  session.currentProblemIdx = idx;
  render();
}

function addProblem() {
  const sheet = getSheet();
  if (sheet) {
    if (!sheet.problems) sheet.problems = [];
    if (sheet.problems.length < 5) {
      sheet.problems.push({ file: null, answer: "", solutionText: "", solutionFile: null });
      session.currentProblemIdx = sheet.problems.length - 1;
      saveSheetsToFB(); render();
    }
  }
}

function deleteCurrentSheet() {
  if (confirm("정말 삭제하시겠습니까?")) {
    delete appState.sheets[session.selectedSheetId];
    session.selectedSheetId = "";
    saveSheetsToFB(); render();
  }
}

function autoSaveCurrent() {
  const work = getWork();
  if (!work || work.submitted) return;

  const idx = session.currentProblemIdx;
  const canvas = $("#studentCanvas");

  if (!work.responses) work.responses = [];
  if (!work.responses[idx]) work.responses[idx] = {};

  work.responses[idx].solution = $("#inputSolution")?.value || "";
  work.responses[idx].answer = $("#inputAnswer")?.value || "";
  
  if (canvas) {
    // 캔버스 이미지 변환 시 배경을 명시적으로 흰색으로 렌더링
    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    const tempCtx = tempCanvas.getContext("2d");

    tempCtx.fillStyle = "#ffffff";
    tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
    tempCtx.drawImage(canvas, 0, 0);

    work.responses[idx].drawing = tempCanvas.toDataURL("image/jpeg", 0.6);
  }

  saveWorkToFB(work);
}

async function uploadStudentFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const compressed = await compressImage(file);
  const work = getWork();
  const idx = session.currentProblemIdx;
  if (work && !work.submitted) {
    if (!work.responses) work.responses = [];
    if (!work.responses[idx]) work.responses[idx] = {};
    work.responses[idx].attachedFile = compressed;
    saveWorkToFB(work);
    render();
  }
}

function insertSymbol(sym, targetId) {
  const input = $("#" + targetId);
  if (input) {
    input.value += sym;
    input.focus();
    if (targetId === 'inputAnswer') autoSaveCurrent();
    if (targetId === 'teacherAnswer') updateTeacherAnswer(input.value);
  }
}

function updateTeacherAnswer(val) {
  const sheet = getSheet();
  if (sheet && sheet.problems[session.currentProblemIdx]) {
    sheet.problems[session.currentProblemIdx].answer = val;
    saveSheetsToFB();
  }
}

function updateTeacherSolution(val) {
  const sheet = getSheet();
  if (sheet && sheet.problems[session.currentProblemIdx]) {
    sheet.problems[session.currentProblemIdx].solutionText = val;
    saveSheetsToFB();
  }
}

async function uploadProbFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const compressed = await compressImage(file);
  const sheet = getSheet();
  if (sheet && sheet.problems[session.currentProblemIdx]) {
    sheet.problems[session.currentProblemIdx].file = compressed;
    saveSheetsToFB(); render();
  }
}

async function uploadSolutionFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const compressed = await compressImage(file);
  const sheet = getSheet();
  if (sheet && sheet.problems[session.currentProblemIdx]) {
    sheet.problems[session.currentProblemIdx].solutionFile = compressed;
    saveSheetsToFB(); render();
  }
}

function startTimer() {
  stopTimer();
  session.timerInterval = setInterval(() => {
    const work = getWork();
    if (work && !work.submitted) {
      if (!session.isDeparted) {
        work.activeMs = (work.activeMs || 0) + 1000;
        const display = $("#timeDisplay");
        if (display) display.textContent = formatTime(work.activeMs);
      } else if (session.departureStartTime) {
        const currentDepTime = (work.departureMs || 0) + (Date.now() - session.departureStartTime);
        const depMsEl = $("#departureMsDisplay");
        if (depMsEl) depMsEl.textContent = formatTime(currentDepTime);
      }
    }
  }, 1000);
}

function stopTimer() { if (session.timerInterval) clearInterval(session.timerInterval); }

let isDrawing = false;
function setTool(tool) { session.activeTool = tool; render(); }
function clearCanvas() {
  const cv = $("#studentCanvas");
  if (cv) { 
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, cv.width, cv.height);
    autoSaveCurrent(); 
  }
}

function initCanvas() {
  const cv = $("#studentCanvas");
  if (!cv) return;
  cv.width = cv.offsetWidth;
  cv.height = cv.offsetHeight;

  const ctx = cv.getContext("2d");
  
  // 캔버스 초기 구동 시 흰색 배경 채우기
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, cv.width, cv.height);

  const work = getWork();
  const resp = work?.responses ? work.responses[session.currentProblemIdx] : null;

  if (resp && resp.drawing) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0);
    img.src = resp.drawing;
  }

  function getPos(e) {
    const rect = cv.getBoundingClientRect();
    return {
      x: (e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0)) - rect.left,
      y: (e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0)) - rect.top
    };
  }

  function start(e) {
    if (work?.submitted) return;
    isDrawing = true;
    const pos = getPos(e);
    ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
  }

  function move(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineWidth = session.activeTool === "eraser" ? 20 : 2;
    ctx.strokeStyle = session.activeTool === "eraser" ? "#ffffff" : "#3d405b";
    ctx.lineCap = "round"; ctx.lineTo(pos.x, pos.y); ctx.stroke();
  }

  function stop() { if (isDrawing) { isDrawing = false; autoSaveCurrent(); } }

  cv.onmousedown = start; cv.onmousemove = move; cv.onmouseup = stop;
  cv.ontouchstart = start; cv.ontouchmove = move; cv.ontouchend = stop;
}

window.onload = () => {
  listenFirebase();
  render();
};
</script>
</body>
</html>
