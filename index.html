<!doctype html>
<html lang="ko">

<title>찬경T와 함께하는 수학 문제 풀이</title>
<style>
:root{font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#18304b;background:#eef4f9}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.46;cursor:not-allowed}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(1.65rem,2.6vw,2.3rem);line-height:1.3}h2{font-size:1.35rem}h3{font-size:1.1rem}small,.muted{color:#64788d;line-height:1.5}small{font-size:.85rem}.shell{min-height:100vh}.top{min-height:68px;background:white;border-bottom:1px solid #dbe5ee;display:flex;justify-content:space-between;align-items:center;padding:10px clamp(16px,3vw,44px);gap:12px}.brand{font-size:1.15rem;font-weight:800;color:#173b68}.mark{display:inline-grid;place-items:center;width:35px;height:35px;margin-right:8px;border-radius:11px;background:#173b68;color:white}.top nav{display:flex;gap:6px}.top button,.secondary,.danger,.smallButton{border:1px solid #bcd3e5;background:white;color:#145d89;border-radius:9px;padding:9px 13px;font-weight:700;min-height:40px}.top button.active{background:#e7f3fb}.danger{color:#a9353d;border-color:#e5c3c5}.primary{border:0;border-radius:10px;background:#176aab;color:white;padding:12px 18px;min-height:46px;font-weight:800}.primary:hover{background:#115b94}.page{max-width:1450px;margin:25px auto;padding:0 18px 40px}.entry{max-width:660px;margin:clamp(25px,7vh,90px) auto}.card{background:white;border:1px solid #dce6ee;border-radius:20px;padding:clamp(18px,3vw,32px);box-shadow:0 9px 26px #20456b0c}.card+.card{margin-top:18px}.grid{display:grid;grid-template-columns:minmax(290px,400px) minmax(0,1fr);gap:20px;align-items:start}.studentGrid{grid-template-columns:minmax(300px,1fr) minmax(350px,1.25fr)}.stack>*+*{margin-top:14px}label{display:block;margin:16px 0 0;font-weight:700;font-size:.94rem}input:not([type=checkbox]),textarea,select{display:block;width:100%;border:1px solid #cad9e5;border-radius:10px;background:#fff;color:#18304b;padding:12px 13px;margin-top:7px;min-height:46px;outline:none}input:focus,textarea:focus,select:focus{border-color:#248ec3;box-shadow:0 0 0 3px #caebfa}textarea{resize:vertical;min-height:110px;line-height:1.6}.entry .primary{width:100%;margin-top:22px}.consent{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}.consent input{width:20px;height:20px;accent-color:#176aab}.notice{border:1px solid #e9c9a6;background:#fff8ed;color:#75410e;border-radius:11px;padding:12px 15px;margin:0 0 18px;line-height:1.5}.success{border-color:#b9ddca;background:#f3fbf5;color:#276044}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}.sheetList{display:grid;gap:9px;margin:16px 0}.sheetButton,.workButton{width:100%;text-align:left;border:1px solid #d6e4ef;background:#f8fbfe;color:#18304b;border-radius:11px;padding:12px 14px}.sheetButton.chosen,.workButton.chosen{border-color:#1778b5;background:#e8f5fc}.sheetButton strong,.workButton strong{display:block}.sheetButton small,.workButton small{display:block;margin-top:5px}.problemTabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.problemTabs button,.keys button,.drawTools button{border:1px solid #bfd4e4;background:white;color:#245b7d;border-radius:9px;padding:9px 12px;min-height:40px;font-weight:700}.problemTabs button.active,.drawTools button.active{background:#176aab;border-color:#176aab;color:white}.group{border-top:1px solid #e0eaf2;padding-top:18px;margin-top:18px}.fileBox{border:1px solid #d4e2ec;background:#f8fbfd;padding:13px;border-radius:11px;margin:12px 0}.fileBox img{display:block;max-width:100%;max-height:68vh;object-fit:contain;margin:12px auto;border-radius:8px}.fileBox iframe{width:100%;height: min(70vh,760px);border:1px solid #d6e1eb;background:white;border-radius:8px;margin-top:12px}.fileBox a{color:#176aab}.fileInput{font-size:.9rem}.fileInput input{padding:8px!important}.fileActions{display:flex;gap:8px;align-items:end}.fileActions label{flex:1}.answerField{display:flex;gap:8px;align-items:end}.answerField input{min-width:0;flex:1}.answerField button{flex:none}.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:7px;padding:11px;border:1px solid #d5e5f0;background:#f8fbfd;border-radius:11px;margin-top:8px}.keys button{padding:5px}.canvas{width:100%;height:auto;aspect-ratio:2/1;display:block;border:1px solid #cbd9e6;border-radius:10px;background:white;touch-action:none;cursor:crosshair}.drawTools{margin:10px 0;display:flex;gap:7px;flex-wrap:wrap}.photo{display:block;max-width:100%;max-height:300px;object-fit:contain;border:1px solid #dae4ed;border-radius:10px;margin:10px 0}.timer{font-variant-numeric:tabular-nums;color:#0c5d92;background:#eaf5fd;padding:8px 11px;border-radius:9px;font-weight:800}.badge{display:inline-block;border-radius:99px;padding:6px 10px;background:#e6f5f9;color:#096482;font-size:.88rem;font-weight:800}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.comparison article{min-width:0;border:1px solid #d6e3ed;background:#f8fbfd;border-radius:12px;padding:15px}.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.divider{height:1px;background:#dfebf3;margin:22px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.printArea{display:none}.empty{padding:14px;background:#f6f9fc;border-radius:10px;color:#64788d}.status{min-height:24px;color:#a5481b;margin-top:10px}.fileName{overflow-wrap:anywhere}.questionTitle{margin:16px 0 9px}details{margin-top:12px}summary{cursor:pointer;color:#176aab;font-weight:700}
@media(max-width:850px){.grid,.studentGrid{grid-template-columns:1fr}.page{padding:0 14px 28px}.top{align-items:flex-start;flex-direction:column}.comparison{grid-template-columns:1fr}}@media(max-width:520px){.answerField{flex-wrap:wrap}.answerField input,.answerField button{width:100%;flex:auto}}
@media print{@page{size:A4;margin:13mm}body{background:white;color:#111}.top,.page{display:none!important}.printArea{display:block!important;font:11pt/1.5 Arial,"Malgun Gothic",sans-serif}.printArea h1{font-size:17pt}.printBlock{break-after:page;border-top:2px solid #333;padding-top:6mm}.printBlock img{max-width:100%;max-height:130mm;object-fit:contain}.printBlock .comparison{grid-template-columns:1fr 1fr}.printBlock .comparison article{border:1px solid #aaa;background:white}.printArea .fileBox{border:0;padding:0;background:white}.printArea iframe{display:none}}
</style>
</head>
<body>
<div class="shell"><header class="top"><div class="brand"><span class="mark">∑</span>찬경T와 함께하는 수학 문제 풀이</div><nav><button id="studentNav" type="button">학생용</button><button id="teacherNav" type="button">교사용</button></nav></header><main id="app" class="page"></main><div id="printArea" class="printArea"></div></div>
<script>
"use strict";
/* 모든 코드와 스타일은 이 파일 안에 있습니다. 자료는 이 브라우저의 IndexedDB에 저장됩니다. */
const $=(s,root=document)=>root.querySelector(s);
const esc=(v)=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const symbols=["√","π","θ","±","∞","≤","≥","≠","×","÷","²","³","°","∠","(",")","/","^","sin(","cos(","tan(","log(","ln("];
const fresh=()=>({sheets:[],works:[]});
const mem={mode:"student",teacher:false,sheetId:"",workId:"",problem:0,selectedWork:"",consent:false,number:"",name:"",drawingTool:"pen",teacherDrawingTool:"pen",keyOpen:false,teacherKeyOpen:false,notice:"",printItems:[],lastTick:Date.now()};
let state=fresh(),database=null,channel=null,saveQueue=Promise.resolve(),renderBusy=false;
const dbOpen=()=>new Promise((resolve,reject)=>{const req=indexedDB.open("chan-math-single-html",1);req.onupgradeneeded=()=>req.result.createObjectStore("records");req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
const readDB=()=>new Promise((resolve,reject)=>{const tx=database.transaction("records","readonly"),req=tx.objectStore("records").get("classroom");req.onsuccess=()=>resolve(req.result||fresh());req.onerror=()=>reject(req.error)});
const writeDB=(value)=>new Promise((resolve,reject)=>{const tx=database.transaction("records","readwrite");tx.objectStore("records").put(value,"classroom");tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
async function save(){const snapshot=structuredClone(state);saveQueue=saveQueue.catch(()=>{}).then(()=>writeDB(snapshot));await saveQueue;channel?.postMessage("changed")}
async function refresh(){if(!database||renderBusy)return;try{await saveQueue;state=await readDB();render()}catch(e){message("저장된 자료를 읽지 못했어요: "+e.message)}}
function message(text){mem.notice=text;const el=$("#notice");if(el){el.textContent=text;el.hidden=!text}else render()}
function sheet(){return state.sheets.find(s=>s.id===mem.sheetId)}
function work(){return state.works.find(w=>w.id===mem.workId)}
function selectedWork(){return state.works.find(w=>w.id===mem.selectedWork)}
const current=(arr,i)=>arr?.[i]||null;
function emptyProblem(){return {file:null,solution:"",answer:"",solutionDrawing:"",solutionPhoto:""}}
function emptyAnswer(){return {solution:"",answer:"",drawing:"",photo:""}}
function norm(v){return String(v??"").normalize("NFKC").toLocaleLowerCase().replace(/\s+/g,"").trim()}
function correct(answer,expected){if(!norm(answer)||!norm(expected))return null;return String(expected).split("|").some(x=>norm(x)===norm(answer))}
function grade(a,p){const c=correct(a?.answer,p?.answer);return c===null?"미채점":c?"정답!":"오답!"}
function time(ms){const n=Math.floor(Math.max(0,ms)/1000);return `${String(Math.floor(n/3600)).padStart(2,"0")}:${String(Math.floor(n/60)%60).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`}
const fileType=f=>["image/jpeg","image/png","image/webp"].includes(f?.type)?"image":f?.type==="application/pdf"?"pdf":"";
function filePreview(f){if(!f)return '<div class="empty">첨부된 문제 파일이 없어요.</div>';return `<div class="fileBox"><strong class="fileName">${esc(f.name)}</strong>${f.type==="application/pdf"?`<iframe title="${esc(f.name)}" src="${f.data}"></iframe><a href="${f.data}" download="${esc(f.name)}">PDF 내려받기</a>`:`<img src="${f.data}" alt="${esc(f.name)}">`}</div>`}
function photoPreview(data){return data?`<img class="photo" src="${data}" alt="첨부한 풀이 사진">`:""}
function answerInput(id,value,open){return `<div class="answerField"><input id="${id}" value="${esc(value)}" autocomplete="off" placeholder="답을 입력하세요"><button type="button" class="secondary" data-key-toggle="${id}" aria-expanded="${open}">공학용 키보드</button></div>${open?`<div class="keys">${symbols.map((s,i)=>`<button type="button" data-symbol="${i}" data-target="${id}">${esc(s)}</button>`).join("")}</div>`:""}`}
function drawEditor(id,data,teacher=false){const tool=teacher?mem.teacherDrawingTool:mem.drawingTool;return `<div class="drawTools"><button type="button" data-draw-tool="pen" data-draw-id="${id}" class="${tool==="pen"?"active":""}">펜</button><button type="button" data-draw-tool="eraser" data-draw-id="${id}" class="${tool==="eraser"?"active":""}">지우개</button><button type="button" data-draw-clear="${id}">전체 지우기</button></div><canvas id="${id}" class="canvas" width="1000" height="500" aria-label="펜으로 풀이 작성"></canvas>`}
function noticeHTML(){return `<div id="notice" class="notice" ${mem.notice?"":"hidden"}>${esc(mem.notice)}</div>`}
function render(){renderBusy=true;const app=$("#app");$("#studentNav").classList.toggle("active",mem.mode==="student");$("#teacherNav").classList.toggle("active",mem.mode==="teacher");if(mem.mode==="teacher")app.innerHTML=teacherPage();else if(mem.workId&&work())app.innerHTML=studentPage();else app.innerHTML=entryPage();bindCanvases();renderBusy=false}
function entryPage(){const published=state.sheets.filter(s=>s.published);if(!published.some(s=>s.id===mem.sheetId))mem.sheetId="";return `<section class="card entry">${noticeHTML()}<small>학생용</small><h1>찬경T와 함께하는 수학 문제 풀이</h1><p class="muted">학습지를 선택하고 학번과 이름을 입력하세요.</p><p class="notice">단일 파일 버전입니다. 작성 내용은 이 기기의 브라우저에만 저장되며 다른 기기의 교사 화면과 연결되지 않습니다.</p>${published.length?`<label for="selectSheet">학습지 선택</label><select id="selectSheet"><option value="">학습지를 선택하세요</option>${published.map(s=>`<option value="${s.id}" ${mem.sheetId===s.id?"selected":""}>${esc(s.title)}</option>`).join("")}</select>`:'<p class="empty">아직 배포된 학습지가 없어요. 선생님이 배포하면 여기에 나타납니다.</p>'}<label for="studentNumber">학번</label><input id="studentNumber" inputmode="numeric" placeholder="예: 20815" value="${esc(mem.number)}"><label for="studentName">이름</label><input id="studentName" placeholder="이름" value="${esc(mem.name)}"><label class="consent"><input id="consent" type="checkbox" ${mem.consent?"checked":""}><span>개인정보 수집 및 이용에 동의합니다</span></label><button id="enter" class="primary" type="button" ${published.length&&mem.sheetId&&mem.number.trim()&&mem.name.trim()&&mem.consent?"":"disabled"}>선택한 학습지 입장하기</button></section>`}
function teacherPage(){if(!mem.teacher)return `<section class="card entry">${noticeHTML()}<small>교사용</small><h1>교사 화면</h1><label for="password">교사 비밀번호</label><input id="password" type="password" autocomplete="current-password"><button id="teacherLogin" class="primary" style="width:100%;margin-top:22px" type="button">들어가기</button></section>`;
const s=sheet();return `<div class="grid"><aside class="card">${noticeHTML()}<div class="row between"><h2>학습지 관리</h2><button type="button" class="secondary" id="teacherLogout">나가기</button></div><label for="newTitle">새 학습지 제목</label><input id="newTitle" placeholder="예: 2학년 3반 기하"><button id="createSheet" class="primary" style="width:100%;margin-top:14px">학습지 만들기</button><div class="divider"></div><h3>학습지 목록</h3>${state.sheets.length?`<div class="sheetList">${state.sheets.map(x=>`<button class="sheetButton ${x.id===mem.sheetId?"chosen":""}" data-select-sheet="${x.id}"><strong>${esc(x.title)}</strong><small>${x.published?"학생에게 배포 중":"작성 중"} · ${x.problems.length}문제 · ${state.works.filter(w=>w.sheetId===x.id).length}명</small></button>`).join("")}</div>`:'<p class="empty">새 학습지를 만들어 주세요.</p>'}${s?`<div class="group"><h3>학생 현황</h3><div class="row"><button class="secondary" data-export="all">학생 전체 자료 PDF로 저장</button><button class="danger" data-delete-works="all">이 학습지의 학생 풀이 모두 삭제</button></div><div class="sheetList">${state.works.filter(w=>w.sheetId===s.id).map(w=>`<button class="workButton ${w.id===mem.selectedWork?"chosen":""}" data-select-work="${w.id}"><strong>${esc(w.number)} ${esc(w.name)}</strong><small>${w.status==="submitted"?"제출 완료":"풀이 중"} · ${w.presence==="away"?"이탈":"참여 중"} · 이탈 ${w.departures||0}회 · ${time(w.activeMs||0)}</small></button>`).join("")||'<div class="empty">아직 참여한 학생이 없어요.</div>'}</div></div>`:""}</aside><section class="card">${s?teacherDetail(s):'<h2>학습지를 선택하세요</h2><p class="muted">학습지를 만든 후 문제별 PDF나 사진을 첨부할 수 있어요.</p>'}</section></div>`}
function teacherDetail(s){const i=Math.min(mem.problem,s.problems.length-1);mem.problem=i;const p=s.problems[i],w=selectedWork();return `<div class="row between"><h2>${esc(s.title)}</h2><span class="badge">${s.published?"배포 중":"작성 중"}</span></div><label for="editTitle">학습지 제목</label><input id="editTitle" value="${esc(s.title)}"><div class="actions"><button class="primary" id="saveTitle">제목 저장</button><button class="secondary" id="togglePublish">${s.published?"배포 중지":"학생에게 배포"}</button><button class="danger" id="deleteSheet">학습지 삭제</button></div><div class="group"><h3>문제 파일 올리기</h3><p class="muted">문제마다 PDF 또는 사진을 선택하세요. 최대 3문제입니다.</p>${s.problems.map((x,n)=>`<div class="fileActions"><label>문제 ${n+1} 파일 (PDF 또는 사진)<input class="fileInput" type="file" accept="application/pdf,image/jpeg,image/png,image/webp" data-problem-file="${n}"></label><button class="danger" data-remove-file="${n}" ${x.file?"":"disabled"}>파일 삭제</button></div><small>${x.file?esc(x.file.name):"선택된 파일 없음"}</small>`).join("")}<div class="actions">${s.problems.length<3?'<button class="secondary" id="addProblem">문제 추가</button>':""}${s.problems.length>1?'<button class="danger" id="removeProblem">마지막 문제 삭제</button>':""}</div></div><div class="group"><h3>교사 답과 풀이</h3><div class="problemTabs">${s.problems.map((_,n)=>`<button data-problem="${n}" class="${n===i?"active":""}">문제 ${n+1}</button>`).join("")}</div>${filePreview(p.file)}<label for="teacherSolution">문제 ${i+1} 풀이</label><textarea id="teacherSolution" placeholder="풀이를 입력하세요">${esc(p.solution)}</textarea><label>풀이 펜글씨</label>${drawEditor("teacherCanvas",p.solutionDrawing,true)}<label>풀이 사진 첨부<input type="file" id="teacherPhotoInput" accept="image/jpeg,image/png,image/webp"></label>${photoPreview(p.solutionPhoto)}${p.solutionPhoto?'<button class="danger" id="removeTeacherPhoto">사진 삭제</button>':""}<label for="teacherAnswer">정답</label>${answerInput("teacherAnswer",p.answer,mem.teacherKeyOpen)}<small>여러 정답을 인정하려면 | 로 구분하세요. 예: √2 | 2^(1/2)</small></div>${w?`<div class="group"><div class="row between"><h3>학생 풀이 · ${esc(w.number)} ${esc(w.name)}</h3><span class="badge">${w.status==="submitted"?"제출 완료":"풀이 중"}</span></div><p>경과 ${time(w.activeMs||0)} · ${w.presence==="away"?"이탈":"참여 중"} · 이탈 ${w.departures||0}회</p>${w.responses.map((a,n)=>`<details ${n===i?"open":""}><summary>문제 ${n+1} · ${esc(grade(a,s.problems[n]))}</summary><p><strong>학생 답:</strong> ${esc(a.answer)||"미입력"}</p><div class="text"><strong>학생 풀이:</strong><br>${esc(a.solution)||"미입력"}</div>${a.drawing?photoPreview(a.drawing):""}${photoPreview(a.photo)}</details>`).join("")}<div class="actions"><button class="secondary" data-export="one">이 학생 PDF로 저장</button><button class="danger" id="deleteWork">이 학생 풀이 삭제</button></div></div>`:""}`}
function studentPage(){const s=sheet(),w=work();if(!s||!w){mem.workId="";return entryPage()}mem.problem=Math.min(mem.problem,s.problems.length-1);const i=mem.problem,p=s.problems[i],a=w.responses[i]||emptyAnswer();return `<div class="grid studentGrid"><section class="card"><div class="row between"><h2>${esc(s.title)}</h2><span class="badge">${esc(w.number)} ${esc(w.name)}</span></div><div class="row"><span class="timer" id="timer">${time(w.activeMs||0)}</span><span class="badge" id="presence">${w.presence==="away"?"이탈 중":"풀이 중"}</span><span>이탈 ${w.departures||0}회</span></div><div class="problemTabs">${s.problems.map((_,n)=>`<button data-problem="${n}" class="${n===i?"active":""}">문제 ${n+1}</button>`).join("")}</div>${filePreview(p.file)}<p class="muted">문제를 읽고 오른쪽에 풀이와 답을 작성하세요.</p></section><section class="card">${noticeHTML()}<div class="row between"><h2>문제 ${i+1} 풀이</h2><button class="secondary" id="leave">학습지에서 나가기</button></div>${w.status==="submitted"?reviewPage(s,w,i):`<label for="studentSolution">풀이 입력</label><textarea id="studentSolution" placeholder="풀이 과정을 적어 주세요">${esc(a.solution)}</textarea><label>펜글씨로 풀이</label>${drawEditor("studentCanvas",a.drawing)}<label>풀이 사진 첨부<input type="file" id="studentPhotoInput" accept="image/jpeg,image/png,image/webp"></label>${photoPreview(a.photo)}${a.photo?'<button class="danger" id="removeStudentPhoto">사진 삭제</button>':""}<label for="studentAnswer">답 입력</label>${answerInput("studentAnswer",a.answer,mem.keyOpen)}<div class="actions"><button class="secondary" id="saveDraft">풀이 저장</button><button class="primary" id="submit">모든 문제 풀이 제출</button></div><p class="muted">작성한 내용은 자동 저장됩니다. 제출 후에는 문제별 정답과 교사 풀이를 확인할 수 있어요.</p>`}</section></div>`}
function reviewPage(s,w,i){const a=w.responses[i],p=s.problems[i];return `<p class="notice success">제출 완료 · 문제 ${i+1}: <strong>${esc(grade(a,p))}</strong></p><div class="comparison"><article><h3>내가 제출한 답과 풀이</h3><p><strong>답:</strong> ${esc(a.answer)||"미입력"}</p><div class="text"><strong>풀이:</strong><br>${esc(a.solution)||"미입력"}</div>${photoPreview(a.drawing)}${photoPreview(a.photo)}</article><article><h3>교사 답과 풀이</h3><p><strong>답:</strong> ${esc(p.answer)||"미입력"}</p><div class="text"><strong>풀이:</strong><br>${esc(p.solution)||"미입력"}</div>${photoPreview(p.solutionDrawing)}${photoPreview(p.solutionPhoto)}</article></div><p class="muted">답의 공백과 대소문자만 정리해 비교합니다. 수학적으로 같은 다른 표현은 자동 판정하지 못할 수 있어요.</p>`}
function bindCanvases(){const cv=$("#teacherCanvas")||$("#studentCanvas");if(!cv)return;const teacher=cv.id==="teacherCanvas",data=teacher?sheet()?.problems[mem.problem]?.solutionDrawing:work()?.responses[mem.problem]?.drawing,ctx=cv.getContext("2d");ctx.fillStyle="white";ctx.fillRect(0,0,cv.width,cv.height);if(data){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,cv.width,cv.height);img.src=data}let drawing=false,last=null;const point=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);last=point(e);e.preventDefault()};cv.onpointermove=e=>{if(!drawing)return;const p=point(e),tool=teacher?mem.teacherDrawingTool:mem.drawingTool;ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=tool==="eraser"?38:3;ctx.strokeStyle=tool==="eraser"?"white":"#173b68";ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault()};cv.onpointerup=async()=>{if(!drawing)return;drawing=false;const target=teacher?sheet()?.problems[mem.problem]:work()?.responses[mem.problem];if(target){target[teacher?"solutionDrawing":"drawing"]=cv.toDataURL("image/png");try{await save()}catch(e){message("필기 저장 실패: "+e.message)}}};cv.onpointercancel=cv.onpointerup}
async function fileData(file,limit){if(!file||!(fileType(file)))throw new Error("PDF 또는 JPG·PNG·WebP 파일을 선택해 주세요.");if(file.size>limit)throw new Error(`파일 크기는 ${Math.round(limit/1048576)}MB 이하로 해주세요.`);return new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res({name:file.name.slice(0,180),type:file.type,data:reader.result});reader.onerror=()=>rej(new Error("파일을 읽지 못했어요."));reader.readAsDataURL(file)})}
async function act(event){const t=event.target;try{
if(t.id==="studentNav"){mem.mode="student";mem.notice="";render();return}if(t.id==="teacherNav"){mem.mode="teacher";mem.notice="";render();return}
if(t.id==="teacherLogin"){if($("#password")?.value==="mathchan"){mem.teacher=true;mem.notice="";render()}else message("교사 비밀번호를 확인해 주세요.");return}
if(t.id==="teacherLogout"){mem.teacher=false;mem.mode="student";render();return}
if(t.id==="enter"){const s=sheet();if(!s?.published||!mem.consent||!mem.number.trim()||!mem.name.trim())return;let w=state.works.find(x=>x.sheetId===s.id&&x.number===mem.number.trim()&&x.name===mem.name.trim());if(!w){w={id:uid(),sheetId:s.id,number:mem.number.trim(),name:mem.name.trim(),responses:s.problems.map(emptyAnswer),status:"draft",startedAt:Date.now(),activeMs:0,lastSeen:Date.now(),presence:"here",departures:0};state.works.push(w)}else{w.responses=s.problems.map((_,i)=>w.responses[i]||emptyAnswer());w.presence="here";w.lastSeen=Date.now()}mem.workId=w.id;mem.problem=0;mem.lastTick=Date.now();await save();render();return}
if(t.id==="leave"){await setAway();mem.workId="";mem.notice="";render();return}
if(t.id==="createSheet"){const title=$("#newTitle").value.trim();if(!title)return message("학습지 제목을 입력해 주세요.");const s={id:uid(),title:title.slice(0,100),published:false,problems:[emptyProblem()],createdAt:Date.now()};state.sheets.unshift(s);mem.sheetId=s.id;mem.problem=0;mem.selectedWork="";await save();render();return}
if(t.dataset.selectSheet){mem.sheetId=t.dataset.selectSheet;mem.problem=0;mem.selectedWork="";render();return}
if(t.dataset.selectWork){mem.selectedWork=t.dataset.selectWork;render();return}
if(t.dataset.problem!==undefined){mem.problem=Number(t.dataset.problem);mem.keyOpen=false;mem.teacherKeyOpen=false;render();return}
if(t.id==="saveTitle"){const v=$("#editTitle").value.trim();if(!v)return message("제목을 입력해 주세요.");sheet().title=v.slice(0,100);await save();render();return}
if(t.id==="togglePublish"){sheet().published=!sheet().published;await save();render();return}
if(t.id==="deleteSheet"){if(!confirm("이 학습지와 학생 풀이를 모두 삭제할까요?"))return;const id=mem.sheetId;state.sheets=state.sheets.filter(s=>s.id!==id);state.works=state.works.filter(w=>w.sheetId!==id);mem.sheetId=state.sheets[0]?.id||"";mem.selectedWork="";await save();render();return}
if(t.id==="addProblem"){const s=sheet();if(s.problems.length<3){s.problems.push(emptyProblem());mem.problem=s.problems.length-1;await save();render()}return}
if(t.id==="removeProblem"){const s=sheet();if(s.problems.length<=1||!confirm(`마지막 문제 ${s.problems.length}번과 해당 풀이를 삭제할까요?`))return;s.problems.pop();state.works.filter(w=>w.sheetId===s.id).forEach(w=>w.responses.pop());mem.problem=s.problems.length-1;await save();render();return}
if(t.dataset.removeFile!==undefined){sheet().problems[Number(t.dataset.removeFile)].file=null;await save();render();return}
if(t.id==="removeTeacherPhoto"){sheet().problems[mem.problem].solutionPhoto="";await save();render();return}
if(t.id==="removeStudentPhoto"){work().responses[mem.problem].photo="";await save();render();return}
if(t.id==="saveDraft"){await save();message("풀이를 저장했어요.");return}
if(t.id==="submit"){if(!confirm("모든 문제의 답과 풀이를 제출할까요? 제출 후에는 수정할 수 없어요."))return;work().status="submitted";await save();render();return}
if(t.id==="deleteWork"){if(!confirm("선택한 학생의 풀이를 삭제할까요?"))return;state.works=state.works.filter(w=>w.id!==mem.selectedWork);mem.selectedWork="";await save();render();return}
if(t.dataset.deleteWorks){if(!confirm("이 학습지의 학생 풀이를 모두 삭제할까요?"))return;state.works=state.works.filter(w=>w.sheetId!==mem.sheetId);mem.selectedWork="";await save();render();return}
if(t.dataset.export){const s=sheet(),works=t.dataset.export==="one"?[selectedWork()].filter(Boolean):state.works.filter(w=>w.sheetId===s.id);if(!works.length)return message("저장할 학생 자료가 없어요.");makeReport(s,works);await Promise.all([...document.querySelectorAll("#printArea img")].map(img=>img.decode().catch(()=>{})));window.print();return}
if(t.dataset.keyToggle){const id=t.dataset.keyToggle;if(id==="teacherAnswer")mem.teacherKeyOpen=!mem.teacherKeyOpen;else mem.keyOpen=!mem.keyOpen;const input=$("#"+id);const start=input?.selectionStart;render();const next=$("#"+id);next?.focus();if(start!=null)next.setSelectionRange(start,start);return}
if(t.dataset.symbol!==undefined){const input=$("#"+t.dataset.target),s=symbols[Number(t.dataset.symbol)],pos=input.selectionStart,end=input.selectionEnd;input.value=input.value.slice(0,pos)+s+input.value.slice(end);input.focus();input.setSelectionRange(pos+s.length,pos+s.length);input.dispatchEvent(new Event("input",{bubbles:true}));return}
if(t.dataset.drawTool){if(t.dataset.drawId==="teacherCanvas")mem.teacherDrawingTool=t.dataset.drawTool;else mem.drawingTool=t.dataset.drawTool;for(const b of document.querySelectorAll('[data-draw-tool]'))b.classList.toggle("active",b.dataset.drawTool===t.dataset.drawTool);return}
if(t.dataset.drawClear){const cv=$("#"+t.dataset.drawClear),ctx=cv.getContext("2d");ctx.fillStyle="white";ctx.fillRect(0,0,cv.width,cv.height);if(t.dataset.drawClear==="teacherCanvas")sheet().problems[mem.problem].solutionDrawing="";else work().responses[mem.problem].drawing="";await save();return}
}catch(e){message("작업을 완료하지 못했어요: "+e.message)}}
async function changed(e){const t=e.target;try{
if(t.id==="selectSheet"){mem.sheetId=t.value;render();return}
if(t.id==="studentNumber"){mem.number=t.value;$("#enter").disabled=!(mem.sheetId&&mem.number.trim()&&mem.name.trim()&&mem.consent);return}
if(t.id==="studentName"){mem.name=t.value;$("#enter").disabled=!(mem.sheetId&&mem.number.trim()&&mem.name.trim()&&mem.consent);return}
if(t.id==="consent"){mem.consent=t.checked;$("#enter").disabled=!(mem.sheetId&&mem.number.trim()&&mem.name.trim()&&mem.consent);return}
if(t.id==="teacherSolution"){sheet().problems[mem.problem].solution=t.value;await save();return}
if(t.id==="teacherAnswer"){sheet().problems[mem.problem].answer=t.value;await save();return}
if(t.id==="studentSolution"||t.id==="studentAnswer"){const w=work();if(w?.status!=="draft")return;w.responses[mem.problem][t.id==="studentSolution"?"solution":"answer"]=t.value;await save();return}
if(t.dataset.problemFile!==undefined){const f=t.files[0];if(!f)return;sheet().problems[Number(t.dataset.problemFile)].file=await fileData(f,8*1048576);await save();render();return}
if(t.id==="teacherPhotoInput"||t.id==="studentPhotoInput"){const f=t.files[0];if(!f)return;const data=await fileData(f,2*1048576);if(data.type==="application/pdf")throw new Error("풀이 사진은 이미지 파일을 선택해 주세요.");if(t.id==="teacherPhotoInput")sheet().problems[mem.problem].solutionPhoto=data.data;else work().responses[mem.problem].photo=data.data;await save();render();return}
}catch(err){message("저장하지 못했어요: "+err.message)}}
function makeReport(s,works){$("#printArea").innerHTML=`<h1>${esc(s.title)} · 학생 풀이</h1>${s.problems.map((p,i)=>works.map(w=>{const a=w.responses[i]||emptyAnswer();return `<section class="printBlock"><h2>문제 ${i+1} · ${esc(w.number)} ${esc(w.name)} · ${esc(grade(a,p))}</h2>${p.file?.type?.startsWith("image/")?`<div class="fileBox"><h3>문제 파일</h3><img src="${p.file.data}" alt="문제 ${i+1}"></div>`:p.file?`<p>문제 PDF: ${esc(p.file.name)} (PDF 본문은 브라우저 인쇄에 포함되지 않을 수 있습니다)</p>`:""}<div class="comparison"><article><h3>학생 답과 풀이</h3><p>답: ${esc(a.answer)}</p><div class="text">${esc(a.solution)}</div>${photoPreview(a.drawing)}${photoPreview(a.photo)}</article><article><h3>교사 답과 풀이</h3><p>답: ${esc(p.answer)}</p><div class="text">${esc(p.solution)}</div>${photoPreview(p.solutionDrawing)}${photoPreview(p.solutionPhoto)}</article></div></section>`}).join("")).join("")}`}
async function setAway(){const w=work();if(!w)return;if(w.presence!=="away"){w.departures=(w.departures||0)+1;w.presence="away"}w.lastSeen=Date.now();await save()}
document.addEventListener("click",act);document.addEventListener("input",changed);document.addEventListener("change",changed);
document.addEventListener("visibilitychange",async()=>{const w=work();if(!w)return;if(document.hidden)await setAway();else{w.presence="here";w.lastSeen=Date.now();mem.lastTick=Date.now();await save();render()}});
window.addEventListener("pagehide",()=>{const w=work();if(w&&w.presence!=="away"){w.departures=(w.departures||0)+1;w.presence="away";save()}});
setInterval(async()=>{const now=Date.now(),w=work();if(w&&!document.hidden){w.activeMs=(w.activeMs||0)+Math.max(0,Math.min(now-mem.lastTick,5000));w.lastSeen=now;if(mem.mode==="student"&&$("#timer"))$("#timer").textContent=time(w.activeMs);if(Math.floor(now/5000)!==Math.floor(mem.lastTick/5000))try{await save()}catch(e){}}mem.lastTick=now},1000);
setInterval(()=>{if(mem.mode==="teacher"&&mem.teacher&&!document.activeElement?.matches("input,textarea,select"))refresh()},3000);
(async()=>{try{database=await dbOpen();state=await readDB();channel=typeof BroadcastChannel!=="undefined"?new BroadcastChannel("chan-math-single-html"):null;if(channel)channel.onmessage=()=>{if(mem.mode==="teacher")refresh()};render()}catch(e){$("#app").innerHTML=`<section class="card entry"><h1>저장소를 열 수 없어요</h1><p>이 브라우저에서 로컬 파일의 저장소 사용을 허용한 뒤 다시 열어 주세요.</p><p class="muted">${esc(e.message)}</p></section>`}})();
</script>
</body>
